[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rydberg-qrc-pinn"
version = "0.1.0"
description = "Fixed Rydberg reservoir features for physics-informed Black-Scholes experiments"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrc_pinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
